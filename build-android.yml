name: Build Android APK (Capacitor)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-android.yml"
      - "package.json"
      - "capacitor.config.ts"
      - "www/**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # Adds the native android/ project if it doesn't exist yet.
      - name: Add Android platform
        run: npx cap add android

      # Copies www/ and capacitor.config.ts into the native project.
      - name: Sync Capacitor
        run: npx cap sync android

      - name: Grant execute permission to gradlew
        run: chmod +x android/gradlew

      # Debug build: signed automatically with Android's built-in debug
      # keystore, so the resulting APK installs directly on any device
      # with no extra signing step. Not suitable for the Play Store —
      # ask if you need a release build with your own keystore later.
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HemamApp-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
